[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "flexos-sdk"
version = "0.1.0"
description = "Official Flex SDK and signed .flexpkg builder"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["cryptography>=42,<47"]
authors = [{ name = "Account Dev" }]
license = { text = "Apache-2.0" }

[project.scripts]
flex = "flexsdk.cli:main"

[tool.setuptools.packages.find]
include = ["flexsdk*"]
